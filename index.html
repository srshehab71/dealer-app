<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise POS - Pro Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
        .hidden-section { display: none; }
    </style>
</head>
<body class="text-slate-800 min-h-screen">

    <!-- ১. অথেন্টিকেশন পেজ -->
    <div id="auth-screen" class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="glass max-w-md w-full p-10 rounded-[3rem] shadow-2xl border border-white">
            <div class="text-center mb-10">
                <div class="bg-indigo-600 w-16 h-16 rounded-3xl mx-auto flex items-center justify-center text-white text-3xl mb-4"><i class="fas fa-lock"></i></div>
                <h1 id="auth-title" class="text-2xl font-bold">লগইন করুন</h1>
                <p id="auth-msg" class="text-xs text-slate-400 mt-2 italic">সিস্টেম প্রস্তুত ✅</p>
            </div>

            <!-- এরর অ্যালার্ট বক্স -->
            <div id="alert-box" class="hidden mb-6 p-4 rounded-2xl text-xs font-bold text-center border"></div>

            <div class="space-y-4">
                <input id="email" type="email" placeholder="ইমেইল অ্যাড্রেস" class="w-full p-4 rounded-2xl border outline-none focus:ring-2 ring-indigo-500">
                <div id="pass-area">
                    <input id="password" type="password" placeholder="পাসওয়ার্ড" class="w-full p-4 rounded-2xl border outline-none focus:ring-2 ring-indigo-500">
                </div>
            </div>

            <button onclick="handleAuthAction()" id="primary-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-8 shadow-lg active:scale-95 transition">প্রবেশ করুন</button>

            <div class="mt-8 flex justify-between text-xs font-bold text-indigo-600 px-2">
                <button onclick="switchMode('reg')" id="reg-link">নতুন অ্যাকাউন্ট</button>
                <button onclick="switchMode('forgot')" id="forgot-link">পাসওয়ার্ড রিসেট</button>
                <button onclick="switchMode('login')" id="login-link" class="hidden text-slate-400">লগইন এ ফিরে যান</button>
            </div>
        </div>
        <!-- লাইভ ডিব্যাগ কনসোল -->
        <div class="mt-10 p-4 bg-black text-green-400 rounded-xl w-full max-w-md text-[10px] font-mono opacity-80">
            <p class="mb-1 border-b border-white/20 pb-1">SYSTEM LOG:</p>
            <div id="debug-log">অ্যাপটি লোড হয়েছে...</div>
        </div>
    </div>

    <!-- ২. ড্যাশবোর্ড স্ক্রিন (লগইন সফল হলে দেখাবে) -->
    <div id="dashboard" class="hidden-section min-h-screen bg-slate-50 p-6">
        <h1 class="text-3xl font-bold italic text-indigo-700">স্বাগতম ড্যাশবোর্ডে!</h1>
        <p class="text-sm text-gray-500">আপনার সিস্টেম এখন সচল।</p>
        <button onclick="logout()" class="mt-10 bg-red-500 text-white px-6 py-2 rounded-xl">লগ আউট</button>
    </div>

    <script>
        // --- সুপাবেস তথ্য ---
        const S_URL = "https://ejworjslsnypfekqoewi.supabase.co";
        const S_KEY = "sb_publishable_TRkyBw7lUa6-6wyQTBOwqg_7Ln1aM8n"; // <--- আপনার Key সাবধানে দিন
        
        const supabase = window.supabase.createClient(S_URL, S_KEY);
        let authMode = 'login';

        function log(msg) {
            const el = document.getElementById('debug-log');
            el.innerHTML = `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>` + el.innerHTML;
        }

        // বাটন মোড পরিবর্তন
        function switchMode(m) {
            log("Mode changed to: " + m);
            authMode = m;
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('primary-btn');
            const passArea = document.getElementById('pass-area');
            const regLink = document.getElementById('reg-link');
            const forgotLink = document.getElementById('forgot-link');
            const loginLink = document.getElementById('login-link');
            document.getElementById('alert-box').classList.add('hidden');

            if(m === 'reg') {
                title.innerText = "নতুন অ্যাকাউন্ট"; btn.innerText = "অ্যাকাউন্ট খুলুন";
                passArea.style.display = 'block'; regLink.classList.add('hidden'); forgotLink.classList.add('hidden'); loginLink.classList.remove('hidden');
            } else if(m === 'forgot') {
                title.innerText = "পাসওয়ার্ড উদ্ধার"; btn.innerText = "লিঙ্ক পাঠান";
                passArea.style.display = 'none'; regLink.classList.add('hidden'); forgotLink.classList.add('hidden'); loginLink.classList.remove('hidden');
            } else {
                title.innerText = "লগইন করুন"; btn.innerText = "প্রবেশ করুন";
                passArea.style.display = 'block'; regLink.classList.remove('hidden'); forgotLink.classList.remove('hidden'); loginLink.classList.add('hidden');
            }
        }

        // অথেন্টিকেশন প্রসেস
        async function handleAuthAction() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('primary-btn');

            log("Handling " + authMode + " for " + email);
            if(!email) return alert("ইমেইল দিন!");

            btn.innerText = "অপেক্ষা করুন...";
            btn.disabled = true;

            try {
                if(authMode === 'login') {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
                    if(error) throw error;
                    log("Login Success! Reloading...");
                    location.reload();
                } else if(authMode === 'reg') {
                    const { data, error } = await supabase.auth.signUp({ email, password: pass });
                    if(error) throw error;
                    log("Reg Success! Creating profile...");
                    await supabase.from('profiles').insert([{ id: data.user.id, email: email, role: 'SR' }]);
                    alert("রেজিস্ট্রেশন সফল! ইমেইল কনফার্ম করুন (যদি অন থাকে) অথবা লগইন করুন।");
                    switchMode('login');
                } else {
                    const { error } = await supabase.auth.resetPasswordForEmail(email);
                    if(error) throw error;
                    alert("রিসেট লিঙ্ক পাঠানো হয়েছে।");
                }
            } catch(e) {
                log("ERROR: " + e.message);
                notify(e.message);
            } finally {
                btn.innerText = (authMode==='login'?'প্রবেশ করুন':(authMode==='reg'?'অ্যাকাউন্ট খুলুন':'লিঙ্ক পাঠান'));
                btn.disabled = false;
            }
        }

        function notify(msg) {
            const box = document.getElementById('alert-box');
            box.innerText = "এরর: " + msg;
            box.className = "mb-6 p-4 rounded-2xl text-xs font-bold text-center bg-red-50 text-red-600 border border-red-100";
            box.classList.remove('hidden');
        }

        async function init() {
            log("Checking session...");
            const { data: { user } } = await supabase.auth.getUser();
            if(user) {
                log("User loged in: " + user.email);
                document.getElementById('auth-screen').classList.add('hidden-section');
                document.getElementById('dashboard').classList.remove('hidden-section');
            } else {
                log("No active user found.");
            }
        }

        async function logout() { await supabase.auth.signOut(); location.reload(); }

        window.onload = init;
    </script>
</body>
</html>
