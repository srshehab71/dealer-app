<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Dealer POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .view-section { display: none; }
        .view-section.active { display: block; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
        .print-only { display: none; }
    </style>
</head>
<body class="text-slate-800">

    <!-- ১. অথেন্টিকেশন স্ক্রিন -->
    <div id="auth-screen" class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="glass max-w-md w-full p-10 rounded-[3rem] shadow-2xl border border-white">
            <div class="text-center mb-10">
                <div class="bg-indigo-600 w-20 h-20 rounded-3xl mx-auto flex items-center justify-center text-white text-4xl mb-4 shadow-xl"><i class="fas fa-user-shield"></i></div>
                <h1 id="auth-title" class="text-3xl font-bold">লগইন করুন</h1>
                <p id="auth-msg" class="text-sm text-slate-400 mt-2">আপনার ডিলার অ্যাকাউন্টে প্রবেশ করুন</p>
            </div>

            <!-- অন-স্ক্রিন এরর বক্স (ডিব্যাগ করার জন্য) -->
            <div id="alert-box" class="hidden mb-6 p-4 rounded-2xl text-xs font-bold text-center border"></div>

            <div class="space-y-4">
                <input id="email" type="email" placeholder="ইমেইল অ্যাড্রেস" class="w-full p-4 rounded-2xl border border-slate-200 outline-none focus:ring-2 ring-indigo-500">
                <div id="pass-area">
                    <input id="password" type="password" placeholder="পাসওয়ার্ড" class="w-full p-4 rounded-2xl border border-slate-200 outline-none focus:ring-2 ring-indigo-500">
                </div>
            </div>

            <button onclick="handleAuth()" id="auth-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-8 shadow-lg active:scale-95 transition text-lg">প্রবেশ করুন</button>

            <div class="mt-8 flex flex-col gap-4 text-center text-xs font-bold text-indigo-600">
                <div id="auth-links" class="flex justify-between px-2">
                    <button onclick="changeMode('reg')">নতুন অ্যাকাউন্ট</button>
                    <button onclick="changeMode('forgot')">পাসওয়ার্ড রিসেট</button>
                </div>
                <button id="back-to-login" class="hidden text-slate-400" onclick="changeMode('login')"><i class="fas fa-arrow-left mr-2"></i>লগইন এ ফিরে যান</button>
            </div>
        </div>
        <!-- ডিব্যাগ কনসোল (মোবাইলে এরর দেখার জন্য) -->
        <div id="debug-log" class="mt-10 text-[10px] text-gray-400 max-w-xs text-center opacity-50">System Initializing...</div>
    </div>

    <!-- ২. মেইন ড্যাশবোর্ড -->
    <div id="dashboard" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col no-print">
            <div class="p-8 border-b border-slate-800">
                <h2 class="text-xl font-black text-indigo-400 italic tracking-tighter">DEALER POS</h2>
                <p id="user-role" class="text-[10px] uppercase opacity-50 mt-1">SR User</p>
            </div>
            <nav class="flex-1 p-6 space-y-3">
                <button onclick="showPage('order')" class="nav-item w-full p-4 text-left rounded-2xl bg-indigo-600 font-bold flex items-center"><i class="fas fa-shopping-cart w-8 text-lg"></i>অর্ডার</button>
                <button onclick="showPage('history')" class="nav-item w-full p-4 text-left rounded-2xl hover:bg-slate-800 flex items-center"><i class="fas fa-history w-8 text-lg"></i>হিস্ট্রি</button>
                <button id="admin-only" onclick="showPage('stock')" class="hidden nav-item w-full p-4 text-left rounded-2xl hover:bg-slate-800 flex items-center"><i class="fas fa-boxes w-8 text-lg"></i>স্টক</button>
            </nav>
            <div class="p-6 border-t border-slate-800">
                <button onclick="logout()" class="w-full p-4 text-left text-red-400 font-bold hover:bg-red-500/10 rounded-2xl"><i class="fas fa-sign-out-alt mr-3"></i>লগ আউট</button>
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-10 overflow-y-auto no-print">
            <!-- Order Page -->
            <section id="page-order" class="view-section active space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <h2 class="text-3xl font-black italic">অর্ডার কাটুন</h2>
                    <input id="shop-input" class="w-full md:w-80 p-4 rounded-2xl border-none shadow-sm focus:ring-2 ring-indigo-500 outline-none" placeholder="দোকানের নাম...">
                </div>
                <div id="p-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
            </section>
            <!-- History Page -->
            <section id="page-history" class="view-section space-y-6">
                <h2 class="text-3xl font-black italic">অর্ডার হিস্ট্রি</h2>
                <div id="history-list" class="space-y-4"></div>
            </section>
            <!-- Stock Page -->
            <section id="page-stock" class="view-section space-y-6">
                <h2 class="text-3xl font-black italic text-indigo-600">পণ্য ম্যানেজমেন্ট</h2>
                <div class="bg-white p-6 rounded-[2rem] border shadow-sm space-y-4">
                    <div class="grid md:grid-cols-3 gap-4">
                        <input id="np-name" class="p-4 border rounded-xl" placeholder="নাম">
                        <input id="np-price" type="number" class="p-4 border rounded-xl" placeholder="মূল্য">
                        <input id="np-stock" type="number" class="p-4 border rounded-xl" placeholder="স্টক">
                    </div>
                    <button onclick="saveProduct()" class="bg-slate-900 text-white px-8 py-4 rounded-xl font-bold">সেভ করুন</button>
                </div>
                <div id="admin-p-list" class="space-y-3"></div>
            </section>
        </main>

        <!-- Floating Cart Footer -->
        <div id="cart-box" class="fixed bottom-6 right-6 left-6 md:left-auto md:w-96 glass p-6 rounded-[2.5rem] shadow-2xl border border-indigo-100 hidden z-50 no-print">
            <div class="flex justify-between items-center mb-4">
                <p class="text-sm font-bold text-gray-500">মোট বিল:</p>
                <p class="text-2xl font-black text-indigo-700">৳ <span id="cart-total">0</span></p>
            </div>
            <button onclick="submitOrder()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-green-100 active:scale-95 transition">কনফার্ম অর্ডার</button>
        </div>
    </div>

    <!-- Print View -->
    <div id="print-area" class="print-only"></div>

    <script>
        // ১. সুপাবেস কনফিগারেশন (আপনার জন্য URL বসিয়ে দিলাম)
        const RAW_URL = "https://ejworjslsnypfekqoewi.supabase.co";
        const RAW_KEY = "sb_publishable_TRkyBw7lUa6-6wyQTBOwqg_7Ln1aM8n"; // <--- আপনার Key দিন

        const SB_URL = RAW_URL.trim();
        const SB_KEY = RAW_KEY.trim();

        let supabase;
        try {
            supabase = window.supabase.createClient(SB_URL, SB_KEY);
            document.getElementById('debug-log').innerText = "Supabase Ready ✅";
        } catch (e) {
            document.getElementById('debug-log').innerText = "Supabase Config Error: " + e.message;
        }

        let authMode = 'login';
        let currentUser = null;
        let products = [];
        let cart = [];

        // ২. অথেন্টিকেশন লজিক (যা বাটন ঠিক করবে)
        function changeMode(mode) {
            authMode = mode;
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('auth-btn');
            const passArea = document.getElementById('pass-area');
            const links = document.getElementById('auth-links');
            const back = document.getElementById('back-to-login');
            
            if(mode === 'reg') {
                title.innerText = "অ্যাকাউন্ট খুলুন"; btn.innerText = "রেজিস্ট্রেশন";
                passArea.style.display = 'block'; links.classList.add('hidden'); back.classList.remove('hidden');
            } else if(mode === 'forgot') {
                title.innerText = "পাসওয়ার্ড রিসেট"; btn.innerText = "রিসেট লিঙ্ক পাঠান";
                passArea.style.display = 'none'; links.classList.add('hidden'); back.classList.remove('hidden');
            } else {
                title.innerText = "লগইন করুন"; btn.innerText = "প্রবেশ করুন";
                passArea.style.display = 'block'; links.classList.remove('hidden'); back.classList.add('hidden');
            }
        }

        async function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();
            const btn = document.getElementById('auth-btn');

            if(!email) return notify("ইমেইল দিন!");
            btn.innerText = "প্রসেসিং..."; btn.disabled = true;

            try {
                if(authMode === 'login') {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
                    if(error) throw error;
                    location.reload();
                } else if(authMode === 'reg') {
                    const { data, error } = await supabase.auth.signUp({ email, password: pass });
                    if(error) throw error;
                    await supabase.from('profiles').insert([{ id: data.user.id, email: email, role: 'SR' }]);
                    notify("রেজিস্ট্রেশন সফল! লগইন করুন।", "green"); changeMode('login');
                } else {
                    const { error } = await supabase.auth.resetPasswordForEmail(email);
                    if(error) throw error;
                    notify("রিসেট লিঙ্ক ইমেইলে পাঠানো হয়েছে।", "indigo");
                }
            } catch(e) { notify(e.message); }
            finally { btn.innerText = (authMode==='login'?'প্রবেশ করুন':(authMode==='reg'?'রেজিস্ট্রেশন':'রিসেট লিঙ্ক পাঠান')); btn.disabled = false; }
        }

        function notify(msg, type='red') {
            const box = document.getElementById('alert-box');
            box.innerText = msg;
            box.className = `mb-6 p-4 rounded-2xl text-xs font-bold text-center bg-${type}-50 text-${type}-600 border border-${type}-100`;
            box.classList.remove('hidden');
        }

        // ৩. ড্যাশবোর্ড লজিক
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('user-role').innerText = profile.role + " Panel";
                if(profile.role !== 'SR') document.getElementById('admin-only').classList.remove('hidden');
                loadProducts();
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if(pageId === 'history') loadHistory();
        }

        async function loadProducts() {
            const { data } = await supabase.from('products').select('*').order('name');
            products = data || [];
            const grid = document.getElementById('p-grid');
            grid.innerHTML = products.map(p => `
                <div onclick="addCart('${p.id}')" class="bg-white p-4 rounded-2xl border shadow-sm active:bg-indigo-50 transition cursor-pointer relative">
                    <h3 class="font-bold text-xs line-clamp-1">${p.name}</h3>
                    <p class="text-indigo-600 font-black text-lg">৳${p.price}</p>
                    <p class="text-[9px] text-gray-400 mt-1">স্টক: ${p.stock}</p>
                    ${cart.find(c => c.id === p.id) ? `<div class="absolute -top-2 -right-2 bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold border-2 border-white">${cart.find(c => c.id === p.id).qty}</div>` : ''}
                </div>
            `).join('');

            const adminList = document.getElementById('admin-p-list');
            if(adminList) {
                adminList.innerHTML = products.map(p => `<div class="bg-white p-4 rounded-xl border flex justify-between"><div><p class="font-bold text-sm">${p.name}</p><p class="text-xs text-gray-400">৳${p.price}</p></div><span class="font-bold text-indigo-600">${p.stock} পিস</span></div>`).join('');
            }
        }

        function addCart(id) {
            const p = products.find(x => x.id === id);
            if(p.stock <= 0) return alert("স্টক নেই!");
            const exists = cart.find(x => x.id === id);
            if(exists) exists.qty++; else cart.push({...p, qty: 1});
            updateCart(); loadProducts();
        }

        function updateCart() {
            const box = document.getElementById('cart-box');
            box.classList.toggle('hidden', cart.length === 0);
            document.getElementById('cart-total').innerText = cart.reduce((s,i)=>s+(i.price*i.qty),0);
        }

        async function submitOrder() {
            const shop = document.getElementById('shop-input').value;
            if(!shop) return alert("দোকানের নাম দিন");
            const { data: order } = await supabase.from('orders').insert([{ shop_name: shop, total_amount: cart.reduce((s,i)=>s+(i.price*i.qty),0), sr_id: currentUser.id }]).select();
            for(let item of cart) {
                await supabase.rpc('decrement_stock', { prod_id: item.id, qty: item.qty });
            }
            alert("সফল!"); cart = []; updateCart(); showPage('history');
        }

        async function loadHistory() {
            const { data } = await supabase.from('orders').select('*').order('created_at', {ascending: false});
            document.getElementById('history-list').innerHTML = (data || []).map(o => `
                <div class="bg-white p-5 rounded-2xl border flex justify-between items-center shadow-sm">
                    <div><h4 class="font-bold text-sm">${o.shop_name}</h4><p class="text-indigo-600 font-black text-xs">৳${o.total_amount}</p></div>
                    <button class="text-slate-400 p-2"><i class="fas fa-print"></i></button>
                </div>`).join('');
        }

        async function saveProduct() {
            const name = document.getElementById('np-name').value;
            const price = document.getElementById('np-price').value;
            const stock = document.getElementById('np-stock').value;
            await supabase.from('products').insert([{ name, price, stock }]);
            alert("সেভ হয়েছে!"); loadProducts();
        }

        async function logout() { await supabase.auth.signOut(); location.reload(); }

        window.onload = checkUser;
    </script>
</body>
</html>
