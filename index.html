<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer POS - Final Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap'); body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-50">
    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl">
        <header class="bg-indigo-600 text-white p-6 rounded-b-3xl">
            <h1 class="text-2xl font-bold">ডিলার ম্যানেজমেন্ট</h1>
            <p id="status" class="text-xs mt-1 text-indigo-200 italic">ডাটাবেজ চেক করা হচ্ছে...</p>
        </header>

        <div id="main" class="p-6">
            <!-- লোডিং বা এরর এখানে দেখাবে -->
            <div id="msg" class="text-center py-10 text-gray-400">অপেক্ষা করুন...</div>
        </div>
    </div>

    <script>
        // --- আপনার জন্য আমি নিজে URL টি বসিয়ে দিলাম ---
        const MY_URL = "https://ejworjslsnypfekqoewi.supabase.co";
        
        // --- আপনি শুধু নিচের এই কোটেশনের ভেতর আপনার KEY টি দিন ---
        const MY_KEY = "sb_publishable_TRkyBw7lUa6-6wyQTBOwqg_7Ln1aM8n"; 

        async function initApp() {
            const msgEl = document.getElementById('msg');
            const statusEl = document.getElementById('status');

            // ১. অটো ক্লিন-আপ (কোনো ভুল স্পেস থাকলে তা মুছে দিবে)
            const cleanUrl = MY_URL.trim();
            const cleanKey = MY_KEY.trim();

            if (cleanKey.includes("আপনার_")) {
                msgEl.innerHTML = `<div class="p-4 bg-yellow-50 text-yellow-700 border rounded-xl text-sm">
                    <b>সতর্কতা:</b> আপনি এখনো কোডের ভেতরে আপনার আসল চাবি (Key) বসাননি। গিটহাবে গিয়ে <code>MY_KEY</code> এর জায়গায় আপনার চাবিটি দিন।
                </div>`;
                return;
            }

            try {
                // সুপাবেস কানেক্ট করা
                const supabase = window.supabase.createClient(cleanUrl, cleanKey);
                
                // ডাটাবেজ থেকে পণ্য আনা
                let { data, error } = await supabase.from('products').select('*');
                
                if (error) throw error;

                statusEl.innerText = "কানেক্টেড ✅";
                msgEl.innerHTML = `<div class="grid grid-cols-2 gap-3">${data.map(p => `
                    <div class="bg-white p-4 border rounded-2xl shadow-sm">
                        <h3 class="font-bold text-gray-700">${p.name}</h3>
                        <p class="text-indigo-600 font-black text-lg">৳${p.price}</p>
                        <p class="text-[10px] text-gray-400">স্টক: ${p.stock} পিস</p>
                    </div>`).join('')}</div>`;

            } catch (e) {
                statusEl.innerText = "কানেকশন ফেইলড ❌";
                msgEl.innerHTML = `<div class="p-4 bg-red-50 text-red-600 border border-red-200 rounded-xl text-xs text-left">
                    <b>এরর মেসেজ:</b><br>${e.message}<br><br>
                    <b>টিপস:</b> সুপাবেস ড্যাশবোর্ড থেকে <b>RLS</b> অফ করেছেন কি না তা নিশ্চিত হোন।
                </div>`;
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
