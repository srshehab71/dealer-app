<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer POS - Logic Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap'); body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-6">

    <div id="auth-box" class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm border">
        <div class="text-center mb-6">
            <div class="bg-blue-600 w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl mb-4">
                <i class="fas fa-key"></i>
            </div>
            <h2 class="text-2xl font-bold">লগইন করুন</h2>
            <p id="debug-text" class="text-[10px] text-gray-400 mt-1 italic">সিস্টেম রেডি...</p>
        </div>

        <div id="error-display" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl"></div>

        <input id="email" type="email" placeholder="ইমেইল" class="w-full p-4 border rounded-xl mb-4 outline-none focus:ring-2 ring-blue-500">
        <input id="pass" type="password" placeholder="পাসওয়ার্ড" class="w-full p-4 border rounded-xl mb-6 outline-none focus:ring-2 ring-blue-500">
        
        <button id="login-btn" onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition">প্রবেশ করুন</button>
    </div>

    <script>
        // --- আপনার তথ্য এখানে দিন ---
        const S_URL = "https://ejworjslsnypfekqoewi.supabase.co";
        const S_KEY = "sb_publishable_TRkyBw7lUa6-6wyQTBOwqg_7Ln1aM8n"; // <--- আপনার Key-টি বসান
        // ---------------------------

        const supabase = window.supabase.createClient(S_URL, S_KEY);

        async function login() {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('pass').value.trim();
            const btn = document.getElementById('login-btn');
            const errBox = document.getElementById('error-display');
            const debugText = document.getElementById('debug-text');

            if(!email || !pass) return alert("ইমেইল ও পাসওয়ার্ড দিন");

            btn.innerText = "চেক করা হচ্ছে...";
            btn.disabled = true;
            errBox.classList.add('hidden');

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
                
                if (error) {
                    throw error;
                } else {
                    debugText.innerText = "লগইন সফল! রিডাইরেক্ট হচ্ছে...";
                    alert("লগইন সফল হয়েছে! স্বাগতম " + data.user.email);
                    // এখানে সফল হওয়ার পর যা করবেন (যেমন ড্যাশবোর্ডে যাওয়া)
                    window.location.reload(); 
                }
            } catch (e) {
                console.error(e);
                errBox.classList.remove('hidden');
                errBox.innerText = "ভুল: " + e.message;
                btn.innerText = "প্রবেশ করুন";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
