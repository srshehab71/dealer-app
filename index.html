<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer POS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap'); body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-50">
    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl pb-24">
        <header class="bg-blue-600 text-white p-6 rounded-b-3xl">
            <h1 class="text-2xl font-bold">ডিলার ম্যানেজমেন্ট</h1>
            <p id="conn-text" class="text-xs mt-1 text-blue-200">কানেকশন চেক করা হচ্ছে...</p>
        </header>

        <div id="main-area" class="p-4">
            <div id="loader" class="text-center py-20">
                <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-4"></div>
                <p class="text-gray-400">ডাটাবেজের সাথে কানেক্ট করা হচ্ছে...</p>
            </div>
            <!-- এরর মেসেজ বক্স -->
            <div id="error-box" class="hidden p-4 bg-red-50 border border-red-200 rounded-2xl">
                <p class="text-red-600 font-bold">কানেকশন সমস্যা!</p>
                <p id="error-msg" class="text-xs text-red-500 mt-2 whitespace-pre-wrap font-mono"></p>
                <p class="text-xs text-gray-500 mt-4 italic">টিপস: সুপাবেস ড্যাশবোর্ড থেকে RLS অফ করুন এবং গিটহাবে সঠিক KEY বসান।</p>
            </div>
        </div>
    </div>

    <script>
        // আপনার সুপাবেস তথ্য (সুপাবেস সেটিংস থেকে কপি করে আনুন)
        const URL = "https://ejworjslsnypfekqoewi.supabase.co";
        const KEY = "sb_publishable_TRkyBw7lUa6-6wyQTBOwqg_7Ln1aM8n"; // <--- এইখানে আসল KEY দিন

        async function init() {
            const errorBox = document.getElementById('error-box');
            const errorMsg = document.getElementById('error-msg');
            const loader = document.getElementById('loader');
            const connText = document.getElementById('conn-text');

            if(KEY.includes("আপনার_")) {
                loader.style.display = 'none';
                errorBox.classList.remove('hidden');
                errorMsg.innerText = "আপনি এখনো গিটহাবের কোডে আপনার আসল KEY বসাননি।";
                return;
            }

            try {
                const supabase = window.supabase.createClient(URL, KEY);
                const { data, error } = await supabase.from('products').select('*');

                if (error) throw error;

                if (data) {
                    connText.innerText = "কানেক্টেড ✅";
                    loader.innerHTML = `<div class='grid grid-cols-2 gap-3'>${data.map(p => `
                        <div class="bg-white p-4 border rounded-2xl shadow-sm">
                            <h3 class="font-bold">${p.name}</h3>
                            <p class="text-blue-600 font-bold text-lg">৳${p.price}</p>
                            <p class="text-[10px] text-gray-400">স্টক: ${p.stock}</p>
                        </div>`).join('')}</div>`;
                }
            } catch (e) {
                loader.style.display = 'none';
                errorBox.classList.remove('hidden');
                errorMsg.innerText = "Error: " + e.message + "\nCode: " + (e.code || "N/A");
                connText.innerText = "কানেকশন ফেইলড ❌";
            }
        }
        window.onload = init;
    </script>
</body>
</html>
