<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer Management System Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
        .tab-btn.active { background: #4f46e5; color: white; shadow: 0 4px 14px rgba(79, 70, 229, 0.4); }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Auth Container -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white max-w-md w-full p-8 rounded-[2.5rem] shadow-2xl border border-slate-100">
            <div class="text-center mb-8">
                <div class="bg-indigo-600 w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl mb-4"><i class="fas fa-shield-alt"></i></div>
                <h1 id="auth-title" class="text-2xl font-bold">লগইন করুন</h1>
                <p id="auth-subtitle" class="text-xs text-slate-400 mt-2">আপনার ডিলার হাউজ একাউন্টে প্রবেশ করুন</p>
            </div>

            <div id="auth-error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-xs rounded-xl border border-red-200 text-center font-bold"></div>

            <div class="space-y-4">
                <input id="auth-email" type="email" placeholder="ইমেইল" class="w-full p-4 rounded-2xl border outline-none focus:ring-2 ring-indigo-500 transition">
                <input id="auth-pass" type="password" placeholder="পাসওয়ার্ড" class="w-full p-4 rounded-2xl border outline-none focus:ring-2 ring-indigo-500 transition">
            </div>

            <button onclick="handleAuthAction()" id="primary-auth-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-6 shadow-lg active:scale-95 transition">প্রবেশ করুন</button>

            <div class="mt-6 flex flex-col gap-3 text-center text-xs font-bold text-indigo-600">
                <div id="auth-toggle-links" class="flex justify-between">
                    <button onclick="changeAuthMode('reg')">নতুন একাউন্ট খুলুন</button>
                    <button onclick="changeAuthMode('forgot')">পাসওয়ার্ড মনে নেই?</button>
                </div>
                <button id="back-to-login" class="hidden text-slate-400" onclick="changeAuthMode('login')">লগইন এ ফিরে যান</button>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar -->
        <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col no-print">
            <div class="p-6 border-b border-slate-800">
                <h2 class="text-xl font-bold text-indigo-400 italic">SYSTEM ADMIN</h2>
                <p id="user-display-role" class="text-[10px] uppercase tracking-tighter opacity-50">SR User</p>
            </div>
            <nav class="flex-1 p-4 space-y-2" id="nav-links">
                <button onclick="showSection('sales')" class="tab-btn w-full p-4 text-left rounded-xl active"><i class="fas fa-cart-plus mr-3"></i>অর্ডার কাটুন</button>
                <button onclick="showSection('history')" class="tab-btn w-full p-4 text-left rounded-xl"><i class="fas fa-history mr-3"></i>অর্ডার লিস্ট</button>
                <button id="admin-only-btn" onclick="showSection('stock')" class="hidden tab-btn w-full p-4 text-left rounded-xl"><i class="fas fa-boxes mr-3"></i>স্টক ম্যানেজ</button>
                <button id="dev-only-btn" onclick="showSection('dev')" class="hidden tab-btn w-full p-4 text-left rounded-xl text-yellow-400"><i class="fas fa-user-shield mr-3"></i>ডেভলপার</button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="logout()" class="w-full p-4 text-left text-red-400 font-bold"><i class="fas fa-power-off mr-3"></i>লগ আউট</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 md:p-10 no-print overflow-y-auto">
            <div id="section-sales" class="app-section">
                <div class="flex flex-col md:flex-row justify-between mb-8 gap-4">
                    <h2 class="text-3xl font-bold italic">অর্ডার এন্ট্রি</h2>
                    <input id="shop-input" class="p-4 border rounded-2xl w-full md:w-80 shadow-sm" placeholder="দোকানের নাম...">
                </div>
                <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
            </div>

            <div id="section-history" class="app-section hidden">
                <h2 class="text-3xl font-bold mb-6 italic">অর্ডার হিস্ট্রি</h2>
                <div class="bg-white rounded-3xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b text-[10px] uppercase font-bold text-slate-400"><tr class="p-4"><th class="p-5">দোকান</th><th class="p-5">টাকা</th><th class="p-5">অ্যাকশন</th></tr></thead>
                        <tbody id="orders-tbody" class="divide-y"></tbody>
                    </table>
                </div>
            </div>

            <div id="section-stock" class="app-section hidden">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border mb-8">
                    <h2 class="text-xl font-bold mb-6">নতুন পণ্য যোগ করুন</h2>
                    <div class="grid md:grid-cols-3 gap-4 mb-6">
                        <input id="np-name" class="p-4 border rounded-xl" placeholder="পণ্য">
                        <input id="np-price" type="number" class="p-4 border rounded-xl" placeholder="মূল্য">
                        <input id="np-stock" type="number" class="p-4 border rounded-xl" placeholder="স্টক">
                    </div>
                    <button onclick="addNewProduct()" class="bg-indigo-600 text-white px-10 py-4 rounded-xl font-bold shadow-lg">পণ্য সেভ করুন</button>
                </div>
                <div id="stock-manage-list" class="space-y-3"></div>
            </div>

            <div id="section-dev" class="app-section hidden">
                <h2 class="text-2xl font-bold text-indigo-700">ইউজার পারমিশন কন্ট্রোল</h2>
                <div id="all-users-list" class="mt-6 space-y-4"></div>
            </div>
        </main>

        <!-- Fixed Cart for Order -->
        <div id="cart-bar" class="fixed bottom-6 right-6 left-6 md:left-auto md:w-96 bg-white/90 backdrop-blur p-6 rounded-[2rem] shadow-2xl border border-indigo-100 hidden no-print">
            <div class="flex justify-between items-center mb-4"><span class="font-bold">নির্বাচিত পণ্য</span><span id="cart-total" class="text-xl font-black text-indigo-600">৳ ০</span></div>
            <div id="cart-items" class="text-xs space-y-1 mb-4 max-h-24 overflow-y-auto"></div>
            <button onclick="submitFinalOrder()" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-green-100">অর্ডার কনফার্ম করুন</button>
        </div>
    </div>

    <div id="invoice-print" class="print-only p-10"></div>

    <script>
        // --- সুপাবেস কানেকশন ---
        const URL = "https://ejworjslsnypfekqoewi.supabase.co";
        const KEY = "আপনার_PUBLISHABLE_KEY_এখানে_দিন"; // <--- আপনার কী দিন
        const supabase = window.supabase.createClient(URL, KEY);

        let user = null;
        let profile = null;
        let products = [];
        let cart = [];
        let authMode = 'login';

        // --- অথেন্টিকেশন লজিক ---
        function changeAuthMode(mode) {
            authMode = mode;
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('primary-auth-btn');
            const links = document.getElementById('auth-toggle-links');
            const back = document.getElementById('back-to-login');
            const passField = document.getElementById('auth-pass');

            if(mode === 'reg') { title.innerText="নতুন একাউন্ট"; btn.innerText="রেজিস্ট্রেশন"; links.classList.add('hidden'); back.classList.remove('hidden'); passField.style.display='block'; }
            else if(mode === 'forgot') { title.innerText="পাসওয়ার্ড উদ্ধার"; btn.innerText="লিঙ্ক পাঠান"; links.classList.add('hidden'); back.classList.remove('hidden'); passField.style.display='none'; }
            else { title.innerText="লগইন করুন"; btn.innerText="প্রবেশ করুন"; links.classList.remove('hidden'); back.classList.add('hidden'); passField.style.display='block'; }
        }

        async function handleAuthAction() {
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            const err = document.getElementById('auth-error');
            err.classList.add('hidden');

            try {
                if(authMode === 'login') {
                    const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
                    if(error) throw error;
                    location.reload();
                } else if(authMode === 'reg') {
                    const { data, error } = await supabase.auth.signUp({ email, password: pass });
                    if(error) throw error;
                    await supabase.from('profiles').insert([{ id: data.user.id, email: email }]);
                    alert("রেজিস্ট্রেশন সফল! লগইন করুন।"); changeAuthMode('login');
                } else {
                    const { error } = await supabase.auth.resetPasswordForEmail(email);
                    if(error) throw error;
                    alert("রিসেট লিঙ্ক পাঠানো হয়েছে।");
                }
            } catch(e) { err.innerText = e.message; err.classList.remove('hidden'); }
        }

        // --- ড্যাশবোর্ড লজিক ---
        async function checkUser() {
            const { data: { user: u } } = await supabase.auth.getUser();
            if(u) {
                user = u;
                const { data: p } = await supabase.from('profiles').select('*').eq('id', user.id).single();
                profile = p;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('user-display-role').innerText = profile.role + " User";
                if(profile.role === 'Admin' || profile.role === 'Dev') document.getElementById('admin-only-btn').classList.remove('hidden');
                if(profile.role === 'Dev') document.getElementById('dev-only-btn').classList.remove('hidden');
                showSection('sales');
            }
        }

        function showSection(name) {
            document.querySelectorAll('.app-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('section-' + name).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget?.classList?.add('active');

            if(name === 'sales' || name === 'stock') loadProductsData();
            if(name === 'history') loadHistoryData();
            if(name === 'dev') loadAllUsers();
        }

        async function loadProductsData() {
            const { data } = await supabase.from('products').select('*').order('name');
            products = data || [];
            
            // Sales Grid
            const grid = document.getElementById('product-list');
            grid.innerHTML = products.map(p => `
                <div onclick="addToCart('${p.id}')" class="bg-white p-4 rounded-3xl border shadow-sm active:bg-indigo-50 cursor-pointer relative">
                    <h3 class="font-bold text-sm text-slate-700">${p.name}</h3>
                    <p class="text-indigo-600 font-black">৳${p.price}</p>
                    <p class="text-[10px] text-slate-400">স্টক: ${p.stock}</p>
                    ${cart.find(c => c.id === p.id) ? `<div class="absolute top-2 right-2 bg-indigo-600 text-white text-[10px] px-2 rounded-full">${cart.find(c => c.id === p.id).qty}</div>` : ''}
                </div>
            `).join('');

            // Stock Table (Admin)
            if(profile.role !== 'SR') {
                document.getElementById('stock-manage-list').innerHTML = products.map(p => `
                    <div class="bg-white p-4 rounded-2xl border flex justify-between items-center shadow-sm">
                        <p class="font-bold">${p.name} <span class="text-gray-400 font-normal">৳${p.price}</span></p>
                        <div class="flex items-center gap-4">
                            <span class="font-bold text-indigo-600">${p.stock} পিস</span>
                            <button onclick="deleteProduct('${p.id}')" class="text-red-400"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            if(p.stock <= 0) return alert("স্টক শেষ!");
            const exists = cart.find(x => x.id === id);
            if(exists) exists.qty++; else cart.push({...p, qty: 1});
            updateCartUI(); loadProductsData();
        }

        function updateCartUI() {
            const bar = document.getElementById('cart-bar');
            bar.classList.toggle('hidden', cart.length === 0);
            document.getElementById('cart-total').innerText = "৳ " + cart.reduce((s,i)=>s+(i.price*i.qty),0);
            document.getElementById('cart-items').innerHTML = cart.map(i => `<div>${i.name} x ${i.qty}</div>`).join('');
        }

        async function submitFinalOrder() {
            const shop = document.getElementById('shop-input').value;
            if(!shop) return alert("দোকানের নাম দিন!");
            const total = cart.reduce((s,i)=>s+(i.price*i.qty),0);
            const { data: o } = await supabase.from('orders').insert([{ shop_name: shop, total_amount: total, sr_id: user.id }]).select();
            for(let item of cart) {
                await supabase.from('order_items').insert([{ order_id: o[0].id, product_name: item.name, quantity: item.qty, price: item.price }]);
                await supabase.rpc('decrement_stock', { prod_id: item.id, qty: item.qty });
            }
            alert("অর্ডার সফল!"); cart = []; updateCartUI(); showSection('history');
        }

        async function loadHistoryData() {
            let query = supabase.from('orders').select('*').order('created_at', {ascending: false});
            if(profile.role === 'SR') query = query.eq('sr_id', user.id);
            const { data } = await query;
            document.getElementById('orders-tbody').innerHTML = (data || []).map(o => `
                <tr class="border-b">
                    <td class="p-5 font-bold">${o.shop_name}</td>
                    <td class="p-5 text-indigo-600 font-bold">৳${o.total_amount}</td>
                    <td class="p-5 text-right flex gap-3 justify-end">
                        <button onclick="printInvoice('${o.id}')" class="p-2 text-slate-400 hover:text-indigo-600"><i class="fas fa-print"></i></button>
                        <button onclick="deleteOrder('${o.id}')" class="p-2 text-red-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function addNewProduct() {
            const name = document.getElementById('np-name').value;
            const price = document.getElementById('np-price').value;
            const stock = document.getElementById('np-stock').value;
            await supabase.from('products').insert([{ name, price, stock }]);
            alert("পণ্য সেভ হয়েছে!"); loadProductsData();
        }

        async function deleteProduct(id) {
            if(confirm("পণ্য ডিলিট করবেন?")) {
                await supabase.from('products').delete().eq('id', id);
                loadProductsData();
            }
        }

        async function deleteOrder(id) {
            if(confirm("অর্ডার ডিলিট করবেন?")) {
                await supabase.from('orders').delete().eq('id', id);
                loadHistoryData();
            }
        }

        async function printInvoice(id) {
            const { data: o } = await supabase.from('orders').select('*').eq('id', id).single();
            const { data: i } = await supabase.from('order_items').select('*').eq('order_id', id);
            document.getElementById('invoice-print').innerHTML = `
                <div style="border-bottom: 2px solid #000; padding-bottom: 20px; text-align: center;">
                    <h1 style="font-size: 24px; font-weight: bold;">ডিলার হাউজ ইনভয়েস</h1>
                    <p>দোকান: ${o.shop_name} | তারিখ: ${new Date(o.created_at).toLocaleString()}</p>
                </div>
                <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
                    <tr style="background: #f1f1f1;"><th style="padding: 10px; border: 1px solid #ddd;">পণ্য</th><th style="padding: 10px; border: 1px solid #ddd;">পরিমাণ</th><th style="padding: 10px; border: 1px solid #ddd;">মূল্য</th></tr>
                    ${i.map(item => `<tr><td style="padding: 10px; border: 1px solid #ddd;">${item.product_name}</td><td style="padding: 10px; border: 1px solid #ddd; text-align: center;">${item.quantity}</td><td style="padding: 10px; border: 1px solid #ddd; text-align: right;">৳${item.price * item.quantity}</td></tr>`).join('')}
                    <tr><td colspan="2" style="padding: 10px; text-align: right; font-weight: bold;">মোট:</td><td style="padding: 10px; text-align: right; font-weight: bold; font-size: 20px;">৳ ${o.total_amount}</td></tr>
                </table>
            `;
            window.print();
        }

        async function loadAllUsers() {
            const { data } = await supabase.from('profiles').select('*');
            document.getElementById('all-users-list').innerHTML = data.map(p => `
                <div class="bg-white p-4 rounded-2xl border flex justify-between items-center">
                    <p class="font-bold">${p.email} <span class="text-indigo-600 font-black ml-4 uppercase text-xs">${p.role}</span></p>
                    <select onchange="updateRole('${p.id}', this.value)" class="p-2 border rounded-xl text-xs">
                        <option value="SR" ${p.role === 'SR' ? 'selected' : ''}>SR</option>
                        <option value="Admin" ${p.role === 'Admin' ? 'selected' : ''}>Admin</option>
                        <option value="Dev" ${p.role === 'Dev' ? 'selected' : ''}>Dev</option>
                    </select>
                </div>
            `).join('');
        }

        async function updateRole(uid, r) {
            await supabase.from('profiles').update({ role: r }).eq('id', uid);
            alert("রোল আপডেট হয়েছে!"); loadAllUsers();
        }

        async function logout() { await supabase.auth.signOut(); location.reload(); }

        window.onload = checkUser;
    </script>
</body>
</html>
