<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealer POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body>
    <div id="app" class="max-w-md mx-auto min-h-screen pb-24 bg-white shadow-2xl relative">
        <header class="bg-blue-600 text-white p-6 rounded-b-[2rem] shadow-lg">
            <h1 class="text-2xl font-bold">ডিলার ম্যানেজমেন্ট</h1>
            <p class="text-blue-100 text-xs">অর্ডার ও স্টক সিস্টেম</p>
        </header>

        <div class="flex p-4 gap-2 no-print">
            <button onclick="switchTab('order')" id="tab-order" class="flex-1 py-3 rounded-2xl bg-blue-600 text-white font-bold shadow-md">অর্ডার</button>
            <button onclick="switchTab('list')" id="tab-list" class="flex-1 py-3 rounded-2xl bg-white text-gray-500 font-bold border">লিস্ট</button>
            <button onclick="switchTab('stock')" id="tab-stock" class="flex-1 py-3 rounded-2xl bg-white text-gray-500 font-bold border">স্টক</button>
        </div>

        <div id="main-content" class="px-4">
            <div id="status-msg" class="text-center py-10 text-gray-400">ডাটা লোড হচ্ছে...</div>
        </div>

        <div id="order-footer" class="fixed bottom-0 max-w-md w-full bg-white p-4 border-t shadow-2xl hidden">
            <div class="flex justify-between items-center">
                <div><p class="text-xs text-gray-400">মোট টাকা</p><p id="total-amount" class="text-xl font-black text-blue-600">৳ ০</p></div>
                <button onclick="confirmOrder()" class="bg-green-600 text-white px-8 py-3 rounded-xl font-bold active:scale-95 transition">অর্ডার দিন</button>
            </div>
        </div>
    </div>

    <script>
        // --- এই দুটি তথ্য আপনার সুপাবেস ড্যাশবোর্ড থেকে কপি করুন ---
        const URL = "https://ejworjslsnypfekqoewi.supabase.co";
        const KEY = "sb_publishable_TRkyBw7lUa6-6wyQTBOwqg_7Ln1aM8n"; // <-- এইখানে অবশ্যই আপনার আসল কীটি দিন
        // -----------------------------------------------------

        const supabase = window.supabase.createClient(URL, KEY);
        let products = [];
        let cart = [];
        let currentTab = 'order';

        async function init() {
            try {
                let { data, error } = await supabase.from('products').select('*');
                if (error) throw error;
                
                products = data || [];
                if (products.length === 0) {
                    document.getElementById('status-msg').innerHTML = "ডাটাবেজে কোনো পণ্য পাওয়া যায়নি! দয়া করে SQL Editor থেকে পণ্য যোগ করুন।";
                } else {
                    render();
                }
            } catch (e) {
                document.getElementById('status-msg').innerHTML = `<div class="p-4 bg-red-100 text-red-700 rounded-lg text-sm">এরর: ${e.message}<br><br>সুপাবেস ড্যাশবোর্ড থেকে RLS অফ করুন।</div>`;
            }
        }

        function switchTab(t) {
            currentTab = t;
            ['order', 'list', 'stock'].forEach(tab => {
                const btn = document.getElementById('tab-' + tab);
                btn.className = (tab === t) ? "flex-1 py-3 rounded-2xl bg-blue-600 text-white font-bold shadow-md" : "flex-1 py-3 rounded-2xl bg-white text-gray-500 font-bold border";
            });
            render();
        }

        function addToCart(id) {
            const p = products.find(i => i.id === id);
            const exists = cart.find(i => i.id === id);
            if(exists) exists.qty++; else cart.push({...p, qty: 1});
            render();
        }

        async function confirmOrder() {
            const name = prompt("দোকানের নাম দিন:");
            if(!name) return;
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            
            const { data: order } = await supabase.from('orders').insert([{ shop_name: name, total_amount: total }]).select();
            
            for (let item of cart) {
                await supabase.from('order_items').insert([{ order_id: order[0].id, product_name: item.name, quantity: item.qty, price: item.price }]);
                await supabase.rpc('decrement_stock', { prod_name: item.name, qty: item.qty });
            }
            alert("সফল হয়েছে!"); cart = []; init();
        }

        function render() {
            const main = document.getElementById('main-content');
            const footer = document.getElementById('order-footer');
            footer.classList.add('hidden');

            if(currentTab === 'order') {
                if(cart.length > 0) {
                    footer.classList.remove('hidden');
                    document.getElementById('total-amount').innerText = "৳ " + cart.reduce((s, i) => s + (i.price*i.qty), 0);
                }
                main.innerHTML = `<div class="grid grid-cols-2 gap-3">${products.map(p => `
                    <div onclick="addToCart('${p.id}')" class="bg-white p-4 rounded-2xl border shadow-sm active:bg-blue-50 cursor-pointer">
                        <h3 class="font-bold text-gray-800">${p.name}</h3>
                        <p class="text-blue-600 font-bold">৳${p.price}</p>
                        <p class="text-[10px] text-gray-400">স্টক: ${p.stock}</p>
                    </div>`).join('')}</div>`;
            } else if(currentTab === 'list') {
                main.innerHTML = "<p class='text-center py-5'>লোডিং...</p>";
                supabase.from('orders').select('*').order('created_at', {ascending: false}).then(({data}) => {
                    main.innerHTML = data.map(o => `
                        <div class="bg-white p-4 rounded-xl border mb-3 flex justify-between items-center">
                            <div><h4 class="font-bold text-sm">${o.shop_name}</h4><p class="text-blue-600 font-bold text-xs">৳${o.total_amount}</p></div>
                            <button onclick="window.print()" class="bg-gray-800 text-white px-3 py-1 rounded text-[10px]">প্রিন্ট</button>
                        </div>`).join('');
                });
            } else {
                main.innerHTML = `<div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-left text-sm">
                    <thead class="bg-gray-50 border-b font-bold"><th class="p-3">পণ্য</th><th class="p-3">স্টক</th></thead>
                    <tbody>${products.map(p => `<tr class="border-b last:border-0"><td class="p-3 font-medium">${p.name}</td><td class="p-3 text-red-600 font-bold">${p.stock} পিস</td></tr>`).join('')}</tbody></table></div>`;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
